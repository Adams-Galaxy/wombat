[package]
name = "wombat"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "A Lua-powered dotfiles compiler"
readme = "README.md"
repository = "https://github.com/Adams-Galaxy/wombat"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mlua = { version = "0.12", features = ["lua55", "vendored"] }
nix = { version = "0.30", features = ["process", "signal"] }
handlebars = { version = "=6.4.3", default-features = false }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "=3.1.2"
tempfile = "3"
thiserror = "2.0"
toml = "0.9"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
