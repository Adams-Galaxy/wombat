[package]
name = "wombat"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Lua-powered dotfiles compiler"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mlua = { version = "0.12", features = ["lua55", "vendored"] }
handlebars = { version = "=6.4.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
similar = "=3.1.1"
tempfile = "3"
thiserror = "2.0"
toml = "0.9"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
